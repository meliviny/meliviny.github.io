<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Meliviny is a personal music platform for curated, device-friendly listening experiences."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meliviny" />
    <title>Meliviny</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/meliviny-icon.svg" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div id="app" class="app-shell" data-ready="false">
      <header class="topbar" aria-label="Site header">
        <div class="brand" aria-label="Meliviny brand">
          <img src="assets/icons/meliviny-icon.svg" alt="" width="32" height="32" />
          <span>Meliviny</span>
        </div>
      </header>

      <main class="page-shell" id="main-content">
        <section class="hero" aria-labelledby="page-title">
          <p class="eyebrow">Phase 01</p>
          <h1 id="page-title">Static foundation</h1>
          <p class="lead">
            Meliviny is being initialized as a lightweight static PWA for personal music experiences.
          </p>
        </section>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
